# KashLink escrow — Foundry configuration.
#
# Arc runs the Osaka EVM (docs.arc.io/arc/references/evm-differences). Standard Foundry compiles and
# deploys to it unchanged; Circle's fork (github.com/circlefin/arc-foundry) additionally simulates
# Arc's native-value rules in `arc-anvil` and is a drop-in replacement for `forge` here.

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./" }]

[fuzz]
runs = 512

# `forge script … --rpc-url arc_testnet`. Values come from contracts/.env (see .env.example).
[rpc_endpoints]
arc = "${ARC_MAINNET_RPC_URL}"
arc_testnet = "${ARC_TESTNET_RPC_URL}"

# Arc's explorer is Blockscout: `forge verify-contract … --verifier blockscout --verifier-url <url>`.
[etherscan]
arc = { key = "", url = "https://explorer.arc.io/api/", chain = 5042 }
arc_testnet = { key = "", url = "https://explorer.testnet.arc.io/api/", chain = 5042002 }
